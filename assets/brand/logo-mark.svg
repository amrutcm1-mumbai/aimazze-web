<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACEHOLDER brand mark for AIMAZZE.

  Replace this file in place (same path, same filename) when the final mark
  lands. Nothing else needs to change: every consumer reads one custom
  property (brand-mark) defined in chambers.css, which points here.

  Requirements for the replacement asset:
    * Square-ish artwork, centred, with transparent padding baked in.
    * Transparent background. The loading fill effect masks on the ALPHA
      channel, so a full-colour (even multi-colour) asset works as-is; the
      silhouette is derived automatically and needs no companion mask file.

  (Note for whoever edits this header: an XML comment may not contain two
  consecutive hyphens, so custom properties are named without their prefix.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AIMAZZE">
  <g fill="none" stroke="#0C6E62" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5.5" y="5.5" width="53" height="53" rx="14" stroke-width="5"/>
    <path d="M20.5 46.5 32 19.5 43.5 46.5" stroke-width="5.5"/>
    <path d="M25.5 36.5h13" stroke-width="5"/>
  </g>
</svg>
